<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cetak Dokumentasi Supervisi</title>
<style>
  :root{font-family:Arial,sans-serif;color:#111;background:#eef2f6}
  *{box-sizing:border-box}
  body{margin:0}
  .toolbar{
    position:sticky;top:0;z-index:10;
    display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:12px 18px;background:#fff;border-bottom:1px solid #d9e0e7;
  }
  .toolbar strong{font-size:15px}
  .toolbar button{
    border:0;border-radius:10px;padding:10px 18px;
    background:#17375e;color:#fff;font-weight:700;cursor:pointer
  }
  .toolbar button:disabled{opacity:.45;cursor:not-allowed}
  #loadingText{padding:20px;text-align:center;color:#64748b}
  #printContent{padding:14px}

  .sheet{
    width:210mm;
    height:297mm;
    margin:0 auto 14px;
    padding:7mm;
    background:#fff;
    overflow:hidden;
    page-break-after:always;
    break-after:page;
    box-shadow:0 2px 12px rgba(15,23,42,.12);
  }
  .sheet:last-child{page-break-after:auto;break-after:auto}
  .doc-header{height:27mm;overflow:hidden}
  h1{
    text-align:center;margin:0 0 3mm;
    font-size:14pt;line-height:1.1
  }
  .meta-grid{
    display:grid;grid-template-columns:1fr 1fr;
    gap:1.5mm 8mm;font-size:8.6pt;line-height:1.2
  }
  .meta-grid>div{display:grid;grid-template-columns:28mm 1fr;gap:1mm}
  .photo-grid{
    height:252mm;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:repeat(3, 1fr);
    gap:4mm;
  }
  .photo-card{
    border:.3mm solid #d7dce2;border-radius:2mm;
    padding:2mm;overflow:hidden;
    display:flex;flex-direction:column;min-height:0
  }
  .photo-card.empty{border-color:transparent}
  .photo-frame{
    height:62mm;flex:0 0 62mm;
    background:#f3f5f7;overflow:hidden;
    display:flex;align-items:center;justify-content:center
  }
  .photo-frame img{width:100%;height:100%;object-fit:cover;display:block}
  .photo-missing{font-size:8pt;color:#777}
  .caption{
    flex:1;padding-top:1.7mm;overflow:hidden;
    font-size:8pt;line-height:1.15
  }
  .caption b{display:block;margin-bottom:.8mm}
  .caption span{display:block}

  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}
    .toolbar,#loadingText{display:none!important}
    #printContent{padding:0}
    .sheet{
      margin:0;padding:7mm;box-shadow:none;
      width:210mm;height:297mm;
    }
  }
</style>
</head>
<body>
<div class="toolbar">
  <strong>Preview Dokumentasi — 6 Foto per Halaman</strong>
  <button id="btnPrint" disabled>Cetak / Simpan PDF</button>
</div>
<div id="loadingText">Memuat dokumentasi...</div>
<div id="printContent"></div>
<script type="module" src="../js/dokumentasi-print-v26.js?v=26"></script>
</body>
</html>
